<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SEPA Finalists — 2026-11-10</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px;
    background: #0f1115; color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    line-height: 1.45;
  }
  h1 { font-size: 18px; margin: 0 0 4px; letter-spacing: .3px; }
  .sub { font-size: 12px; color: #9aa0a6; margin: 0 0 20px; }
  .row {
    display: grid;
    grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
    gap: 14px;
    margin-bottom: 14px;
  }
  .card {
    background: #161a22; border: 1px solid #262b36;
    border-radius: 8px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .card header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 14px; background: #1b2029; border-bottom: 1px solid #262b36;
    font-size: 13px;
  }
  .tag { color: #9aa0a6; font-size: 11px; }
  .chart { height: 520px; width: 100%; }
  .desc { padding: 14px 16px; font-size: 13px; overflow-y: auto; }
  .desc .meta { font-size: 12px; color: #9aa0a6; margin-bottom: 10px; }
  .desc .stats {
    display: flex; flex-wrap: wrap; gap: 6px 10px; margin-bottom: 12px;
  }
  .desc .stats span {
    background: #1b2029; padding: 3px 8px; border-radius: 4px;
    font-size: 11px; color: #c6cbd3; border: 1px solid #262b36;
  }
  .desc .summary { color: #cfd4dc; font-size: 12.5px; white-space: pre-wrap; }
  .desc a { color: #7ab3ff; text-decoration: none; font-size: 11px; }
  .desc a:hover { text-decoration: underline; }
  @media (max-width: 1100px) {
    .row { grid-template-columns: 1fr; }
    .chart { height: 420px; }
  }
</style>
</head>
<body>
<h1>SEPA Finalists — 2026-11-10</h1>
<p class="sub">1-year daily view · dark TradingView chart · SMA 10 / 20 / 50 / 200 overlays</p>

<div id="container"></div>

<script>
  const finalists = [{"t": "PEB", "note": "sepa_vcp 7 \u00b7 +power_play \u00b7 Entry 6 \u00b7 Lead 9 \u00b7 Tight 2/3 \u00b7 RSpct 94 \u00b7 Real Estate \u00b7 Earn 76d \u00b7 RS +80"}, {"t": "HNGE", "note": "sepa_vcp 6 \u00b7 +power_play \u00b7 Entry 5 \u00b7 Lead 12 \u00b7 Tight 1/3 \u00b7 Fund 3/5 \u00b7 RSpct 98 \u00b7 Health Care \u00b7 Earn 65d \u00b7 RS +164"}, {"t": "CCEP", "note": "sepa_vcp 6 \u00b7 +power_play \u00b7 Entry 5 \u00b7 Lead 8 \u00b7 Tight 1/3 \u00b7 RSpct 72 \u00b7 Consumer Staples \u00b7 Earn 72d \u00b7 RS +21"}];
  const info = {"PEB": {"country": "United States", "employees": 52, "industry": "REIT - Hotel & Motel", "marketCap": 2457269760, "name": "Pebblebrook Hotel Trust", "sector": "Real Estate", "summary": "Pebblebrook Hotel Trust is a publicly traded real estate investment trust and the largest owner of urban and resort lifestyle hotels in the United States. The Company owns 43 hotels, totaling approximately 10,900 guest rooms across 14 urban and resort markets. Pebblebrook Hotel Trust is based in Bethesda, United States. Pebblebrook Hotel Trust was established in October, 02 2009 and incorporated in Maryland.", "website": "https://www.pebblebrookhotels.com"}, "HNGE": {"country": "United States", "employees": 1437, "industry": "Health Information Services", "marketCap": 9318591488, "name": "Hinge Health, Inc.", "sector": "Healthcare", "summary": "Hinge Health, Inc. focuses on building a health system that scales and automates the delivery of care using technology. It designs its platform to address musculoskeletal system care (MSK), including acute injury, chronic pain, and post-surgical rehabilitation. The company also provides personalized and automated MSK care through AI-powered motion tracking technology and a proprietary electrical nerve stimulation wearable device. It primarily serves self-insured employers. The company was founded in 2012 and is headquartered in San Francisco, California.", "website": "https://www.hingehealth.com"}, "CCEP": {"country": "United Kingdom", "employees": 37003, "industry": "Beverages - Non-Alcoholic", "marketCap": 49647124480, "name": "Coca-Cola Europacific Partners PLC", "sector": "Consumer Defensive", "summary": "Coca-Cola Europacific Partners PLC, together with its subsidiaries, produces, distributes, and sells a range of non-alcoholic ready-to-drink beverages. It offers flavours, mixers, energy drinks, soft drinks, water, enhanced water, isotonic drinks, tea and coffee, juices, and other drinks. The company provides its products under the Coca-Cola Original Taste, Coca-Cola Zero Sugar, Diet Coke, Sprite, Sprite Zero Sugar, Fanta, Fanta Zero Sugar, Monster Energy, A&W, Absolut Vodka & SPRITE, Ades, Appletiser, aquaBona, Aquarius, BACARD\u00cd Mixed with Coca Cola RTD, Barista Bros, Bonaqua, BURN, Deep Spring, Dr Pepper, Dr Pepper Zero Sugar, Feral Brewing Co, Fuze Tea, Giancarlo Coffee, GLACEAU smartwater, Grinders, HALO, Jack Daniel's & Coca-Cola ready-to-drink, Kristal, L&P, MER, Minute Maid, Mother, Mount Franklin, Nordic Mist, Nutriboost, Oasis, Pulpy, pump, pumped, Reign, Rekorderlig Cider, Relentless, Royal, Royal Bliss, Schweppes, Schweppes Mix, SOCO, URGE, Vilas del Turb\u00f3n, Voyage, Wilkins Pure, and Zephyr Coffee Co brands. It is also involved in the bottling and other operations. The company was formerly known as Coca-Cola European Partners plc and changed its name to Coca-Cola Europacific Partners PLC in May 2021. The company was founded in 1904 and is based in Uxbridge, United Kingdom.", "website": "https://www.cocacolaep.com"}};

  function fmtCap(c) {
    if (!c) return "";
    if (c >= 1e12) return "$" + (c / 1e12).toFixed(1) + "T";
    if (c >= 1e9)  return "$" + (c / 1e9).toFixed(2) + "B";
    if (c >= 1e6)  return "$" + (c / 1e6).toFixed(0) + "M";
    return "$" + c;
  }

  const container = document.getElementById("container");

  finalists.forEach(({ t, note }, idx) => {
    const meta = info[t] || {};
    const cap = fmtCap(meta.marketCap);
    const emp = meta.employees ? meta.employees.toLocaleString() + " empl." : "";
    const sector = [meta.sector, meta.industry].filter(Boolean).join(" · ");
    const country = meta.country || "";
    const summary = meta.summary || "(no description available from Yahoo Finance)";
    const website = meta.website
      ? `<a href="${meta.website}" target="_blank" rel="noreferrer">${meta.website.replace(/^https?:\/\//, "")}</a>`
      : "";

    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div class="card">
        <header>
          <div><strong>${t}</strong> <span class="tag">${note ? "· " + note : ""}</span></div>
          <span class="tag">#${idx + 1}</span>
        </header>
        <div class="chart" id="chart-${t}"></div>
      </div>
      <div class="card">
        <header>
          <div><strong>${meta.name || t}</strong></div>
          <span class="tag">${cap}</span>
        </header>
        <div class="desc">
          <div class="meta">${sector}${country ? " · " + country : ""}</div>
          <div class="stats">
            ${cap ? `<span>Mkt Cap ${cap}</span>` : ""}
            ${emp ? `<span>${emp}</span>` : ""}
            ${website ? `<span>${website}</span>` : ""}
          </div>
          <div class="summary">${summary}</div>
        </div>
      </div>
    `;
    container.appendChild(row);

    const w = document.createElement("script");
    w.type = "text/javascript";
    w.src = "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
    w.async = true;
    w.innerHTML = JSON.stringify({
      autosize: true,
      symbol: t,
      interval: "D",
      timezone: "America/New_York",
      theme: "dark",
      style: "1",
      locale: "en",
      toolbar_bg: "#0f1115",
      range: "12M",
      withdateranges: true,
      allow_symbol_change: true,
      hide_side_toolbar: false,
      save_image: false,
      hideideas: true,
      overrides: {
        "paneProperties.background": "#0f1115",
        "paneProperties.backgroundType": "solid",
        "paneProperties.vertGridProperties.color": "#1f2632",
        "paneProperties.horzGridProperties.color": "#1f2632",
        "symbolWatermarkProperties.transparency": 92,
        "scalesProperties.textColor": "#9aa0a6"
      },
      studies: [
        { id: "MASimple@tv-basicstudies", inputs: { length: 10 } },
        { id: "MASimple@tv-basicstudies", inputs: { length: 20 } },
        { id: "MASimple@tv-basicstudies", inputs: { length: 50 } },
        { id: "MASimple@tv-basicstudies", inputs: { length: 200 } }
      ],
      studies_overrides: {
        // TradingView namespaces duplicate studies as moving average, moving average_1, etc.
        "moving average.ma.color": "#ef4444",
        "moving average.ma.linewidth": 1,
        "moving average_1.ma.color": "#f59e0b",
        "moving average_1.ma.linewidth": 1,
        "moving average_2.ma.color": "#22c55e",
        "moving average_2.ma.linewidth": 2,
        "moving average_3.ma.color": "#60a5fa",
        "moving average_3.ma.linewidth": 2
      },
      support_host: "https://www.tradingview.com"
    });
    document.getElementById(`chart-${t}`).appendChild(w);
  });
</script>
</body>
</html>
