<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SEPA Finalists — 2026-10-23</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px;
    background: #0f1115; color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    line-height: 1.45;
  }
  h1 { font-size: 18px; margin: 0 0 4px; letter-spacing: .3px; }
  .sub { font-size: 12px; color: #9aa0a6; margin: 0 0 20px; }
  .row {
    display: grid;
    grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
    gap: 14px;
    margin-bottom: 14px;
  }
  .card {
    background: #161a22; border: 1px solid #262b36;
    border-radius: 8px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .card header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 14px; background: #1b2029; border-bottom: 1px solid #262b36;
    font-size: 13px;
  }
  .tag { color: #9aa0a6; font-size: 11px; }
  .chart { height: 520px; width: 100%; }
  .desc { padding: 14px 16px; font-size: 13px; overflow-y: auto; }
  .desc .meta { font-size: 12px; color: #9aa0a6; margin-bottom: 10px; }
  .desc .stats {
    display: flex; flex-wrap: wrap; gap: 6px 10px; margin-bottom: 12px;
  }
  .desc .stats span {
    background: #1b2029; padding: 3px 8px; border-radius: 4px;
    font-size: 11px; color: #c6cbd3; border: 1px solid #262b36;
  }
  .desc .summary { color: #cfd4dc; font-size: 12.5px; white-space: pre-wrap; }
  .desc a { color: #7ab3ff; text-decoration: none; font-size: 11px; }
  .desc a:hover { text-decoration: underline; }
  @media (max-width: 1100px) {
    .row { grid-template-columns: 1fr; }
    .chart { height: 420px; }
  }
</style>
</head>
<body>
<h1>SEPA Finalists — 2026-10-23</h1>
<p class="sub">1-year daily view · dark TradingView chart · SMA 10 / 20 / 50 / 200 overlays</p>

<div id="container"></div>

<script>
  const finalists = [{"t": "TTC", "note": "power_play 7 \u00b7 Entry 5 \u00b7 Lead 7 \u00b7 Tight 2/3 \u00b7 Fund 2/5 \u00b7 RSpct 79 \u00b7 Industrials \u00b7 Earn 39d \u00b7 RS +29"}, {"t": "SAIC", "note": "power_play 6 \u00b7 Entry 5 \u00b7 Lead 8 \u00b7 Tight 0/3 \u00b7 RSpct 80 \u00b7 Earn 29d \u00b7 RS +32"}];
  const info = {"TTC": {"country": "United States", "employees": 9227, "industry": "Tools & Accessories", "marketCap": 9201280000, "name": "The Toro Company", "sector": "Industrials", "summary": "The Toro Company provides professional turf maintenance equipment and services. It operates through Professional and Residential segments. It offers riding and walking mowers, greens rollers, all-wheel drive articulating tractors, turf sprayer, utility vehicles, aeration, bunker maintenance, and other turf equipment; sprinkler heads, controllers, turf sensors, valves, and operating software; and riding rotary and reel mowers and attachments, infield grooming equipment, multipurpose vehicles, debris management products, all-wheel drive articulating tractors, sidewalk snow and ice solution vehicles, and related attachments and accessories. The company also provides zero-turn radius riding mowers, walk behind and stand-on mowers, turf application and renovation, tree care, horizontal directional drills, and drilling guidance and support equipment; walk and ride trenchers, vacuum excavators, utility locators and inspection systems, pipe rehabilitation, and replacement solutions; drive chucks and sub savers, drill pipe, starter rods and quick connects, bits and blades, rock tools, reamers, and swivels; and snow removal and ice management solutions. In addition, it offers rotors, sprinkler bodies and nozzles, valves, drip tubing and subsurface irrigation, and electric control devices; wired and wireless rain, freeze, climate, and soil sensors; drip tape, polyethylene tubing, drip line, emitters, filters, fitting, and software related solutions; stand-on skid steers, walk-behind trenchers, stump grinders, material handlers, and other concrete construction equipment; walk power and zero-turn riding mowers, and snow throwers; and grass and hedge trimmers, blower-vacuums, chainsaws, edgers, cultivators, string mowers, and related parts and accessories. The company sells its products al Corporation in September 2013. Science Applications International Corporation was founded in 1969 and is headquartered in Reston, Virginia.", "website": "https://www.saic.com"}};

  function fmtCap(c) {
    if (!c) return "";
    if (c >= 1e12) return "$" + (c / 1e12).toFixed(1) + "T";
    if (c >= 1e9)  return "$" + (c / 1e9).toFixed(2) + "B";
    if (c >= 1e6)  return "$" + (c / 1e6).toFixed(0) + "M";
    return "$" + c;
  }

  const container = document.getElementById("container");

  finalists.forEach(({ t, note }, idx) => {
    const meta = info[t] || {};
    const cap = fmtCap(meta.marketCap);
    const emp = meta.employees ? meta.employees.toLocaleString() + " empl." : "";
    const sector = [meta.sector, meta.industry].filter(Boolean).join(" · ");
    const country = meta.country || "";
    const summary = meta.summary || "(no description available from Yahoo Finance)";
    const website = meta.website
      ? `<a href="${meta.website}" target="_blank" rel="noreferrer">${meta.website.replace(/^https?:\/\//, "")}</a>`
      : "";

    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div class="card">
        <header>
          <div><strong>${t}</strong> <span class="tag">${note ? "· " + note : ""}</span></div>
          <span class="tag">#${idx + 1}</span>
        </header>
        <div class="chart" id="chart-${t}"></div>
      </div>
      <div class="card">
        <header>
          <div><strong>${meta.name || t}</strong></div>
          <span class="tag">${cap}</span>
        </header>
        <div class="desc">
          <div class="meta">${sector}${country ? " · " + country : ""}</div>
          <div class="stats">
            ${cap ? `<span>Mkt Cap ${cap}</span>` : ""}
            ${emp ? `<span>${emp}</span>` : ""}
            ${website ? `<span>${website}</span>` : ""}
          </div>
          <div class="summary">${summary}</div>
        </div>
      </div>
    `;
    container.appendChild(row);

    const w = document.createElement("script");
    w.type = "text/javascript";
    w.src = "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
    w.async = true;
    w.innerHTML = JSON.stringify({
      autosize: true,
      symbol: t,
      interval: "D",
      timezone: "America/New_York",
      theme: "dark",
      style: "1",
      locale: "en",
      toolbar_bg: "#0f1115",
      range: "12M",

      hideideas: true,
      overrides: {

        "paneProperties.backgroundType": "solid",

        "paneProperties.horzGridProperties.color": "#1f2632",
        "symbolWatermarkProperties.transparency": 92,
        "scalesProperties.textColor": "#9aa0a6"
      },
      studies: [
        { id: "MASimple@tv-basicstudies", inputs: { length: 10 } },
        { id: "MASimple@tv-basicstudies", inputs: { length: 20 } },
        { id: "MASimple@tv-basicstudies", inputs: { length: 50 } },
        { id: "MASimple@tv-basicstudies", inputs: { length: 200 } }

      studies_overrides: {

        "moving average.ma.linewidth": 1,
        "moving average_1.ma.color": "#f59e0b",
        "moving average_1.ma.linewidth": 1,
        "moving average_2.ma.color": "#22c55e",
        "moving average_2.ma.linewidth": 2,
        "moving average_3.ma.color": "#60a5fa",
        "moving average_3.ma.linewidth": 2
      },
      support_host: "https://www.tradingview.com"
    });
    document.getElementById(`chart-${t}`).appendChild(w);
  });
</script>
