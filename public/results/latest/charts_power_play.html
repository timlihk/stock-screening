<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SEPA Finalists — 2026-10-30</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px;
    background: #0f1115; color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    line-height: 1.45;
  }
  h1 { font-size: 18px; margin: 0 0 4px; letter-spacing: .3px; }
  .sub { font-size: 12px; color: #9aa0a6; margin: 0 0 20px; }
  .row {
    display: grid;
    grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
    gap: 14px;
    margin-bottom: 14px;
  }
  .card {
    background: #161a22; border: 1px solid #262b36;
    border-radius: 8px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .card header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 14px; background: #1b2029; border-bottom: 1px solid #262b36;
    font-size: 13px;
  }
  .tag { color: #9aa0a6; font-size: 11px; }
  .chart { height: 520px; width: 100%; }
  .desc { padding: 14px 16px; font-size: 13px; overflow-y: auto; }
  .desc .meta { font-size: 12px; color: #9aa0a6; margin-bottom: 10px; }
  .desc .stats {
    display: flex; flex-wrap: wrap; gap: 6px 10px; margin-bottom: 12px;
  }
  .desc .stats span {
    background: #1b2029; padding: 3px 8px; border-radius: 4px;
    font-size: 11px; color: #c6cbd3; border: 1px solid #262b36;
  }
  .desc .summary { color: #cfd4dc; font-size: 12.5px; white-space: pre-wrap; }
  .desc a { color: #7ab3ff; text-decoration: none; font-size: 11px; }
  .desc a:hover { text-decoration: underline; }
  @media (max-width: 1100px) {
    .row { grid-template-columns: 1fr; }
    .chart { height: 420px; }
  }
</style>
</head>
<body>
<h1>SEPA Finalists — 2026-10-30</h1>
<p class="sub">1-year daily view · dark TradingView chart · SMA 10 / 20 / 50 / 200 overlays</p>

<div id="container"></div>

<script>
  const finalists = [{"t": "KO", "note": "power_play 7 \u00b7 +sepa_vcp \u00b7 Entry 6 \u00b7 Lead 7 \u00b7 Tight 2/3 \u00b7 Fund 1/5 \u00b7 RSpct 77 \u00b7 Earn 72d \u00b7 RS +28"}, {"t": "ANF", "note": "power_play 7 \u00b7 +sepa_vcp \u00b7 Entry 5 \u00b7 Lead 11 \u00b7 Tight 2/3 \u00b7 RSpct 96 \u00b7 Earn 17d \u00b7 RS +114"}, {"t": "DGX", "note": "power_play 6 \u00b7 Entry 6 \u00b7 Lead 7 \u00b7 Tight 2/3 \u00b7 Fund 2/5 \u00b7 RSpct 80 \u00b7 Health Care \u00b7 Earn 72d \u00b7 RS +33"}];
  const info = {"KO": {"country": "United States", "employees": 65900, "industry": "Beverages - Non-Alcoholic", "marketCap": 406486745088, "name": "The Coca-Cola Company", "sector": "Consumer Defensive", "summary": "The Coca-Cola Company, a beverage company, manufactures and sells various nonalcoholic beverages in the United States and internationally. The company provides Trademark Coca-Cola, sparkling soft drinks and flavors; water, sports, coffee, and tea; juice, value-added dairy, and plant-based beverages; and emerging beverages. It also offers beverage concentrates and syrups, as well as fountain syrups to fountain retailers comprising restaurants and convenience stores. The company sells its products under the Coca-Cola, Diet Coke/Coca-Cola Light, Coca-Cola Zero Sugar, caffeine free Diet Coke, Cherry Coke, Fanta, Sprite, Simply, Fanta Orange, Fanta Zero Orange, Fanta Zero Sugar, Fanta Apple, Sprite Zero Sugar, Simply Orange, Simply Apple, Simply Grapefruit, Fresca, Schweppes, Thums Up, Aquarius, Ayataka, BODYARMOR, Ciel, Costa, Crystal, Dasani, Fuze Tea, Georgia, glac\u00e9au smartwater, glac\u00e9au vitaminwater, Gold Peak, I LOHAS, Powerade, Topo Chico, Core Power, Del Valle, fairlife, innocent, Maaza, Minute Maid, Minute Maid Pulpy, Santa Clara, and dogadan brands. It operates through a network of independent bottling partners, distributors, wholesalers, and retailers, as well as through bottling and distribution operators. The Coca-Cola Company was founded in 1886 and is headquartered in Atlanta, Georgia.", "website": "https://www.coca-colacompany.com"}, "ANF": {"country": "United States", "employees": 6600, "industry": "Apparel Retail", "marketCap": 6931655680, "name": "Abercrombie & Fitch Co.", "sector": "Consumer Cyclical", "summary": "Abercrombie & Fitch Co., through its subsidiaries, operates as an omnichannel retailer in the Americas, Europe, the Middle East, Africa, and the Asia-Pacific. It offers an assortment of apparel, personal care products, and accessories for men, women, and kids under the Abercrombie & Fitch, abercrombie kids, Your Personal Best, Hollister, and Gilly Hicks brands. The company sells products through its stores, various wholesale, franchise, and licensing arrangements, as well as e-commerce platforms. Abercrombie & Fitch Co. was founded in 1892 and is headquartered in New Albany, Ohio.", "website": "https://corporate.abercrombie.com"}, "DGX": {"country": "United States", "employees": 60000, "industry": "Diagnostics & Research", "marketCap": 27748413440, "name": "Quest Diagnostics Incorporated", "sector": "Healthcare", "summary": "Quest Diagnostics Incorporated provides diagnostic testing and services in the United States. The company develops and delivers diagnostic information services, such as routine, non-routine and advanced clinical testing, anatomic pathology testing, and other diagnostic information services. It also provides services under the Quest Diagnostics brand, as well as under the AmeriPath, Dermpath Diagnostics, ExamOne, and Quanum brands to physicians, hospitals, patients and consumers, health plans, government agencies, employers, retailers, pharmaceutical companies and insurers commercial clinical laboratories, and accountable care organizations through a network of laboratories, patient service centers, phlebotomists in physician offices, call centers and mobile phlebotomists, nurses, and other health and wellness professionals. In addition, the company offers risk assessment services for the life insurance industry; healthcare IT healthcare providers and payers; testing and medical director services at hospital laboratories; test offerings in cardiometabolic and endocrine; cancer; clinical drug monitoring and toxicology; infectious disease, including autoimmune; neurology diagnostics, including Alzheimer's disease; and women's health, such as prenatal genetic; workplace drug testing, testing urine, hair, and oral fluid specimens services; and employer population health services, including biometric screenings, flu shots, and related preventative services. Further, it provides population health solutions; extended care services; develops in vitro diagnostic tests; laboratory diagnostic information and digital health connectivity systems; underwriting support services, including data gathering, paramedical examinations, and clinical laboratory testing and analytics; and national specimen collection and health data solutions. Quest Diagnostics Incorporated was founded in 1967 and is headquartered in Secaucus, New Jersey.", "website": "https://www.questdiagnostics.com"}};

  function fmtCap(c) {
    if (!c) return "";
    if (c >= 1e12) return "$" + (c / 1e12).toFixed(1) + "T";
    if (c >= 1e9)  return "$" + (c / 1e9).toFixed(2) + "B";
    if (c >= 1e6)  return "$" + (c / 1e6).toFixed(0) + "M";
    return "$" + c;
  }

  const container = document.getElementById("container");

  finalists.forEach(({ t, note }, idx) => {
    const meta = info[t] || {};
    const cap = fmtCap(meta.marketCap);
    const emp = meta.employees ? meta.employees.toLocaleString() + " empl." : "";
    const sector = [meta.sector, meta.industry].filter(Boolean).join(" · ");
    const country = meta.country || "";
    const summary = meta.summary || "(no description available from Yahoo Finance)";
    const website = meta.website
      ? `<a href="${meta.website}" target="_blank" rel="noreferrer">${meta.website.replace(/^https?:\/\//, "")}</a>`
      : "";

    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div class="card">
        <header>
          <div><strong>${t}</strong> <span class="tag">${note ? "· " + note : ""}</span></div>
          <span class="tag">#${idx + 1}</span>
        </header>
        <div class="chart" id="chart-${t}"></div>
      </div>
      <div class="card">
        <header>
          <div><strong>${meta.name || t}</strong></div>
          <span class="tag">${cap}</span>
        </header>
        <div class="desc">
          <div class="meta">${sector}${country ? " · " + country : ""}</div>
          <div class="stats">
            ${cap ? `<span>Mkt Cap ${cap}</span>` : ""}
            ${emp ? `<span>${emp}</span>` : ""}
            ${website ? `<span>${website}</span>` : ""}
          </div>
          <div class="summary">${summary}</div>
        </div>
      </div>
    `;
    container.appendChild(row);

    const w = document.createElement("script");
    w.type = "text/javascript";
    w.src = "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
    w.async = true;
    w.innerHTML = JSON.stringify({
      autosize: true,
      symbol: t,
      interval: "D",
      timezone: "America/New_York",
      theme: "dark",
      style: "1",
      locale: "en",
      toolbar_bg: "#0f1115",
      range: "12M",
      withdateranges: true,
      allow_symbol_change: true,
      hide_side_toolbar: false,
      save_image: false,
      hideideas: true,
      overrides: {
        "paneProperties.background": "#0f1115",
        "paneProperties.backgroundType": "solid",
        "paneProperties.vertGridProperties.color": "#1f2632",
        "paneProperties.horzGridProperties.color": "#1f2632",
        "symbolWatermarkProperties.transparency": 92,
        "scalesProperties.textColor": "#9aa0a6"
      },
      studies: [
        { id: "MASimple@tv-basicstudies", inputs: { length: 10 } },
        { id: "MASimple@tv-basicstudies", inputs: { length: 20 } },
        { id: "MASimple@tv-basicstudies", inputs: { length: 50 } },
        { id: "MASimple@tv-basicstudies", inputs: { length: 200 } }
      ],
      studies_overrides: {
        // TradingView namespaces duplicate studies as moving average, moving average_1, etc.
        "moving average.ma.color": "#ef4444",
        "moving average.ma.linewidth": 1,
        "moving average_1.ma.color": "#f59e0b",
        "moving average_1.ma.linewidth": 1,
        "moving average_2.ma.color": "#22c55e",
        "moving average_2.ma.linewidth": 2,
        "moving average_3.ma.color": "#60a5fa",
        "moving average_3.ma.linewidth": 2
      },
      support_host: "https://www.tradingview.com"
    });
    document.getElementById(`chart-${t}`).appendChild(w);
  });
</script>
</body>
</html>
